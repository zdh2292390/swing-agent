[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#2563eb"
backgroundColor = "#f6f8fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"
linkColor = "#2563eb"
font = "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Roboto, Helvetica, Arial, sans-serif"
headingFont = "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Roboto, Helvetica, Arial, sans-serif"
codeFont = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
baseRadius = "10px"
buttonRadius = "8px"
borderColor = "#e2e8f0"
dataframeBorderColor = "#e2e8f0"
dataframeHeaderBackgroundColor = "#f1f5f9"
showWidgetBorder = true
showSidebarBorder = true
chartCategoricalColors = ["#2563eb", "#f59e0b", "#16a34a", "#dc2626", "#7c3aed", "#0891b2", "#db2777", "#65a30d"]

[theme.sidebar]
backgroundColor = "#ffffff"
